server:
  port: 8011
  servlet:
    context-path: /user
spring:
  application:
    name: user
  profiles:
    active: dev # 开发环境
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848} # Nacos地址
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        namespace: public
        group: rest
      discovery:
        namespace: public
        group: rest
  config: # nacos作为配置中心的配置
    import:
      - "optional:nacos:${spring.application.name}-${spring.profiles.active}.yml"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${OJ_MYSQL_HOST:127.0.0.1}:3306/oj?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${OJ_MYSQL_PASSWORD:change-me}
  redis:
    host: ${OJ_REDIS_HOST:127.0.0.1}
    port: 6379
    password: ${OJ_REDIS_PASSWORD:}
  mail: # 邮件配置
    host: smtp.qq.com # 邮件服务器地址
    username: ${OJ_MAIL_USERNAME:} # 你的邮箱地址
    password: ${OJ_MAIL_PASSWORD:}
    default-encoding: utf-8 # 编码格式
    protocol: smtp # 协议
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 当数据库字段使用_连接时这里配置成true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 配置日志
  mapper-locations: classpath*:/mapper/**/*.xml # 配置xml文件位置，这里是和@mapperscan注解的作用是不同的，后者是指定dao的位置
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
dubbo:
  application:
    name: "${spring.application.name}-dubbo"
    logger: slf4j
    protocol: tri
    qos-enable: false
  registry:
    address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}&namespace=public&group=dubbo
    register-mode: instance
  protocol:
    name: tri
    port: 8031
oj:
  domain: ${OJ_DOMAIN:localhost}
  user:
    secret-key: ${OJ_JWT_SECRET:change-me}
    token-expire-hours: 168