server:
  port: 8024
spring:
  application:
    name: gateway # 服务名称
  profiles:
    active: dev # 开发环境
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848} # Nacos地址
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: public
        group: rest
    gateway:
      routes:
        # 前端项目都带/api前缀
        - id: user_route
          uri: lb://user
          predicates:
            - Path=/api/user/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}

        - id: judge_route
          uri: lb://judge
          predicates:
            - Path=/api/judge/**
          filters:
            - RewritePath=/api/(?<segment>.*),/$\{segment}

        - id: sandbox_route
          uri: lb://code-sandbox
          predicates:
            - Path=/api/sandbox/**
          filters:
            - RewritePath=/api/(?<segment>.*),/$\{segment}

oj:
  user:
    secret-key: ${OJ_JWT_SECRET:change-me}
